<style>
  :root{
    --bg:#0b0f1a; --card:#121828; --card2:#171f33; --line:#232d47; --txt:#e6eaf2; --mut:#8b96ad;
    --acc:#6366f1; --acc2:#818cf8; --ok:#34d399; --warn:#fbbf24; --bad:#f87171; --info:#38bdf8; --pink:#f472b6;
    --r:14px; --shadow:0 18px 40px -22px rgba(0,0,0,.8);
    --f:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    --fm:ui-monospace,'SF Mono',Menlo,monospace;
    --hour:58px;
  }
  .ag{font-family:var(--f);color:var(--txt);font-size:14px;-webkit-font-smoothing:antialiased}
  .ag button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  .ag input,.ag select,.ag textarea{font-family:inherit;font-size:13px}
  .top{position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:12px;padding:12px 18px;
    background:rgba(11,15,26,.82);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);flex-wrap:wrap}
  .navg{display:flex;align-items:center;gap:4px}
  .ib{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--mut);transition:.16s}
  .ib:hover{background:var(--card2);color:var(--txt)}
  .ib svg{width:17px;height:17px}
  .today-b{padding:7px 14px;border-radius:9px;border:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--txt);transition:.16s}
  .today-b:hover{border-color:var(--acc2);background:var(--card2)}
  .cur-date{font-size:16px;font-weight:650;letter-spacing:-.02em;min-width:190px;text-transform:capitalize}
  .cur-date span{color:var(--mut);font-weight:400}
  .seg{display:flex;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
  .seg button{padding:6px 13px;border-radius:7px;font-size:12.5px;font-weight:550;color:var(--mut);transition:.18s}
  .seg button:hover{color:var(--txt)}
  .seg button.on{background:var(--acc);color:#fff;box-shadow:0 3px 10px -3px var(--acc)}
  .spacer{flex:1}
  .search{position:relative}
  .search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--mut)}
  .search input{width:190px;padding:8px 10px 8px 32px;border-radius:9px;background:var(--card2);border:1px solid var(--line);color:var(--txt);outline:none;transition:.18s}
  .search input:focus{border-color:var(--acc2);width:230px}
  .fbtn{display:flex;align-items:center;gap:7px;padding:8px 13px;border-radius:9px;border:1px solid var(--line);font-size:12.5px;font-weight:550;color:var(--mut);transition:.16s}
  .fbtn:hover{border-color:var(--acc2);color:var(--txt)}
  .fbtn.act{border-color:var(--acc2);color:var(--acc2)}
  .fbtn svg{width:15px;height:15px}
  .primary{display:flex;align-items:center;gap:7px;padding:9px 16px;border-radius:10px;background:var(--acc);color:#fff;font-size:13px;font-weight:600;
    box-shadow:0 8px 20px -8px var(--acc);transition:.18s}
  .primary:hover{background:var(--acc2);transform:translateY(-1px)}
  .primary svg{width:15px;height:15px}
  .wrap{display:grid;grid-template-columns:262px 1fr;gap:0;height:calc(100vh - 120px)}
  .side{border-right:1px solid var(--line);overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:16px;background:rgba(18,24,40,.35)}
  .main{overflow:hidden;display:flex;flex-direction:column}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:10px;padding:14px 18px 0}
  .st{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;transition:.18s;position:relative;overflow:hidden}
  .st:hover{border-color:var(--acc2);transform:translateY(-2px)}
  .st .l{font-size:10.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.07em;font-weight:600}
  .st .v{font-size:23px;font-weight:700;letter-spacing:-.03em;margin-top:3px;font-variant-numeric:tabular-nums}
  .st .d{font-size:10.5px;color:var(--mut);margin-top:1px}
  .st::after{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--acc)}
  .st.g::after{background:var(--ok)} .st.a::after{background:var(--warn)} .st.r::after{background:var(--bad)} .st.b::after{background:var(--info)} .st.p::after{background:var(--pink)}
  .sbox{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px}
  .sh{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--mut);font-weight:650;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
  .sh .cnt{background:var(--card2);padding:1px 7px;border-radius:99px;font-size:10px;letter-spacing:0}
  .mc-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
  .mc-title{font-size:12.5px;font-weight:650;text-transform:capitalize}
  .mc-nav{display:flex;gap:2px}
  .mc-nav button{width:22px;height:22px;border-radius:6px;color:var(--mut);display:flex;align-items:center;justify-content:center;transition:.15s}
  .mc-nav button:hover{background:var(--card2);color:var(--txt)}
  .mc-nav svg{width:12px;height:12px}
  .mc-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
  .mc-dow{font-size:9.5px;color:var(--mut);text-align:center;font-weight:650;padding:3px 0}
  .mc-d{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:7px;font-size:11.5px;
    color:var(--txt);transition:.14s;position:relative;font-variant-numeric:tabular-nums}
  .mc-d:hover{background:var(--card2)}
  .mc-d.out{color:#3d4763}
  .mc-d.today{color:var(--acc2);font-weight:750}
  .mc-d.sel{background:var(--acc);color:#fff;font-weight:700}
  .mc-d .dot{width:3px;height:3px;border-radius:50%;background:var(--acc2);position:absolute;bottom:3px}
  .mc-d.sel .dot{background:#fff}
  .pro{display:flex;align-items:center;gap:9px;padding:6px 5px;border-radius:8px;transition:.14s;cursor:pointer}
  .pro:hover{background:var(--card2)}
  .pro .sw{width:9px;height:9px;border-radius:3px;flex-shrink:0}
  .pro .nm{font-size:12.5px;flex:1}
  .pro .n{font-size:11px;color:var(--mut);font-variant-numeric:tabular-nums}
  .pro.off{opacity:.36}
  .up{display:flex;gap:9px;padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer;transition:.14s}
  .up:last-child{border-bottom:none}
  .up:hover{opacity:.75}
  .up .bar{width:3px;border-radius:2px;flex-shrink:0}
  .up .t{font-size:11px;color:var(--mut);font-variant-numeric:tabular-nums;min-width:38px}
  .up .n{font-size:12.5px;font-weight:600}
  .up .s{font-size:11px;color:var(--mut)}
  .empty{color:var(--mut);font-size:12px;font-style:italic;padding:6px 0}
  .calbox{flex:1;margin:14px 18px 18px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow)}
  .colhead{display:grid;border-bottom:1px solid var(--line);background:var(--card2);flex-shrink:0}
  .ch{padding:9px 6px;text-align:center;border-left:1px solid var(--line)}
  .ch:first-child{border-left:none}
  .ch .dw{font-size:10.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.07em;font-weight:650}
  .ch .dn{font-size:17px;font-weight:650;margin-top:1px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
  .ch.td .dn{background:var(--acc);color:#fff;width:30px;height:30px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:15px;margin-top:2px}
  .ch.td .dw{color:var(--acc2)}
  .ch .pnm{font-size:12.5px;font-weight:650;display:flex;align-items:center;justify-content:center;gap:6px}
  .ch .pnm i{width:8px;height:8px;border-radius:3px;display:inline-block}
  .gridscroll{flex:1;overflow-y:auto;position:relative}
  .grid{display:grid;position:relative}
  .tcol{border-right:1px solid var(--line);background:var(--card2)}
  .tlab{height:var(--hour);font-size:10.5px;color:var(--mut);text-align:right;padding:2px 7px 0 0;font-variant-numeric:tabular-nums;position:relative;top:-6px}
  .dcol{border-left:1px solid var(--line);position:relative}
  .dcol:first-child{border-left:none}
  .slot{height:var(--hour);border-bottom:1px solid rgba(35,45,71,.5);transition:background .12s;cursor:pointer;position:relative}
  .slot:nth-child(even){background:rgba(255,255,255,.008)}
  .slot:hover{background:rgba(99,102,241,.09)}
  .slot::after{content:'+';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--acc2);font-size:17px;opacity:0;transition:.14s;pointer-events:none}
  .slot:hover::after{opacity:.65}
  .dcol.past{background:rgba(0,0,0,.16)}
  .blk{position:absolute;left:3px;right:3px;border-radius:8px;z-index:3;overflow:hidden;cursor:pointer;
    background:repeating-linear-gradient(45deg,rgba(139,150,173,.14),rgba(139,150,173,.14) 7px,rgba(139,150,173,.05) 7px,rgba(139,150,173,.05) 14px);
    border:1px dashed rgba(139,150,173,.5);display:flex;flex-direction:column;justify-content:center;padding:5px 8px;transition:.15s}
  .blk:hover{border-color:var(--bad);background:repeating-linear-gradient(45deg,rgba(248,113,113,.14),rgba(248,113,113,.14) 7px,rgba(248,113,113,.05) 7px,rgba(248,113,113,.05) 14px)}
  .blk .bt{font-size:10px;font-weight:700;color:var(--mut);font-variant-numeric:tabular-nums}
  .blk .bl{font-size:11px;font-weight:600;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:5px}
  .blk .bl svg{width:12px;height:12px;flex-shrink:0}
  .mblk{font-size:10px;padding:2px 6px;border-radius:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--mut);
    background:repeating-linear-gradient(45deg,rgba(139,150,173,.16),rgba(139,150,173,.16) 5px,transparent 5px,transparent 10px);border-left:2.5px dashed rgba(139,150,173,.5)}
  .qmenu{position:fixed;z-index:120;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:5px;
    box-shadow:0 20px 50px -18px rgba(0,0,0,.9);opacity:0;pointer-events:none;transform:translateY(-6px) scale(.97);transition:.16s;min-width:190px}
  .qmenu.on{opacity:1;pointer-events:auto;transform:none}
  .qmenu button{display:flex;align-items:center;gap:10px;width:100%;padding:9px 11px;border-radius:8px;font-size:13px;font-weight:550;color:var(--txt);transition:.13s;text-align:left}
  .qmenu button:hover{background:var(--card2)}
  .qmenu button svg{width:16px;height:16px;color:var(--mut)}
  .qmenu .qt{font-size:10.5px;color:var(--mut);padding:6px 11px 3px;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
  .ev{position:absolute;left:3px;right:3px;border-radius:8px;padding:5px 8px;overflow:hidden;cursor:grab;
    border-left:3px solid;transition:box-shadow .16s,transform .16s;z-index:4;display:flex;flex-direction:column;gap:1px;user-select:none}
  .ev:hover{box-shadow:0 8px 22px -6px rgba(0,0,0,.7);z-index:8}
  .ev.drag{cursor:grabbing;opacity:.9;z-index:30;box-shadow:0 20px 40px -10px rgba(0,0,0,.9);transform:scale(1.015)}
  .ev .r1{display:flex;align-items:center;gap:5px}
  .ev .tm{font-size:10px;font-weight:700;font-variant-numeric:tabular-nums;opacity:.95}
  .ev .stx{margin-left:auto;font-size:10px;opacity:.9}
  .ev .nm{font-size:12px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ev .sv{font-size:10.5px;opacity:.82;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ev .pr{font-size:9.5px;opacity:.72;display:flex;align-items:center;gap:4px;margin-top:auto}
  .ev .pr i{width:6px;height:6px;border-radius:50%;background:currentColor;display:inline-block}
  .ev.short{padding:3px 8px;justify-content:center}
  .ev.short .sv,.ev.short .pr{display:none}
  .ev.short .r1{gap:6px}
  .ev.cancel{opacity:.5;text-decoration:line-through}
  .rz{position:absolute;left:0;right:0;bottom:0;height:7px;cursor:ns-resize;z-index:9}
  .rz::after{content:'';position:absolute;left:50%;transform:translateX(-50%);bottom:2px;width:24px;height:2.5px;border-radius:2px;background:currentColor;opacity:0;transition:.14s}
  .ev:hover .rz::after{opacity:.55}
  .now{position:absolute;left:0;right:0;height:2px;background:var(--bad);z-index:20;pointer-events:none;box-shadow:0 0 10px rgba(248,113,113,.6)}
  .now::before{content:'';position:absolute;left:-5px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--bad)}
  .mgrid{display:grid;grid-template-columns:repeat(7,1fr);flex:1;overflow-y:auto}
  .mcell{border-left:1px solid var(--line);border-bottom:1px solid var(--line);min-height:104px;padding:5px;transition:.14s;cursor:pointer;display:flex;flex-direction:column;gap:2px}
  .mcell:nth-child(7n+1){border-left:none}
  .mcell:hover{background:rgba(99,102,241,.055)}
  .mcell.out{background:rgba(0,0,0,.18)}
  .mcell .dn{font-size:12px;font-weight:600;color:var(--mut);align-self:flex-start;width:22px;height:22px;display:flex;align-items:center;justify-content:center;border-radius:50%;font-variant-numeric:tabular-nums}
  .mcell.out .dn{color:#3b4460}
  .mcell.today .dn{background:var(--acc);color:#fff;font-weight:700}
  .mev{font-size:10.5px;padding:2px 6px;border-radius:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:2.5px solid;font-weight:550}
  .mmore{font-size:10px;color:var(--mut);padding-left:5px}
  .alist{flex:1;overflow-y:auto;padding:6px 0}
  .aday{padding:12px 18px 6px;font-size:12px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.07em;position:sticky;top:0;background:var(--card);z-index:5;border-bottom:1px solid var(--line)}
  .aday span{color:var(--acc2)}
  .arow{display:flex;align-items:center;gap:13px;padding:11px 18px;border-bottom:1px solid rgba(35,45,71,.55);cursor:pointer;transition:.14s}
  .arow:hover{background:var(--card2)}
  .arow .tm{font-size:12.5px;font-weight:650;font-variant-numeric:tabular-nums;min-width:88px;color:var(--mut)}
  .arow .bar{width:3px;height:34px;border-radius:2px}
  .arow .nm{font-size:13.5px;font-weight:600}
  .arow .sv{font-size:11.5px;color:var(--mut)}
  .arow .rt{margin-left:auto;display:flex;align-items:center;gap:10px}
  .pill{font-size:10px;font-weight:700;padding:2.5px 9px;border-radius:99px;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
  .scrim{position:fixed;inset:0;background:rgba(3,5,12,.6);backdrop-filter:blur(3px);z-index:90;opacity:0;pointer-events:none;transition:opacity .25s}
  .scrim.on{opacity:1;pointer-events:auto}
  .drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,94vw);background:var(--card);border-left:1px solid var(--line);z-index:100;
    transform:translateX(102%);transition:transform .34s cubic-bezier(.22,.8,.24,1);display:flex;flex-direction:column;box-shadow:-30px 0 70px -30px rgba(0,0,0,.9)}
  .drawer.on{transform:none}
  .dhead{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:13px}
  .avat{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px;color:#fff;flex-shrink:0}
  .dbody{flex:1;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:15px}
  .dsec{background:var(--card2);border:1px solid var(--line);border-radius:11px;padding:13px}
  .dsec h4{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--mut);margin-bottom:9px;font-weight:650}
  .kv{display:flex;justify-content:space-between;padding:5px 0;font-size:12.5px;border-bottom:1px solid rgba(35,45,71,.45)}
  .kv:last-child{border-bottom:none}
  .kv .k{color:var(--mut)}
  .kv .v{font-weight:600;text-align:right}
  .hstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
  .hstats div .n{font-size:19px;font-weight:700;letter-spacing:-.02em}
  .hstats div .l{font-size:10px;color:var(--mut);margin-top:1px}
  .note{font-size:12.5px;color:var(--mut);line-height:1.5;font-style:italic}
  .dfoot{padding:13px 18px;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .db{padding:9px;border-radius:9px;font-size:12.5px;font-weight:600;border:1px solid var(--line);color:var(--txt);transition:.16s;display:flex;align-items:center;justify-content:center;gap:6px}
  .db:hover{background:var(--card2);border-color:var(--acc2)}
  .db svg{width:14px;height:14px}
  .db.wa{background:var(--ok);color:#06281c;border-color:transparent;grid-column:span 2}
  .db.wa:hover{filter:brightness(1.1)}
  .db.dg{color:var(--bad)}
  .db.dg:hover{border-color:var(--bad);background:rgba(248,113,113,.08)}
  .modal{position:fixed;inset:0;z-index:110;display:flex;align-items:center;justify-content:center;padding:18px;opacity:0;pointer-events:none;transition:.24s}
  .modal.on{opacity:1;pointer-events:auto}
  .msheet{width:min(660px,96vw);max-height:92vh;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;
    transform:translateY(14px) scale(.985);transition:.28s cubic-bezier(.22,.8,.24,1);box-shadow:0 40px 90px -30px rgba(0,0,0,.9)}
  .modal.on .msheet{transform:none}
  .mhead{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:between;gap:10px}
  .mhead h3{font-size:16px;font-weight:650;letter-spacing:-.02em;flex:1}
  .mbody{padding:18px 20px;overflow-y:auto;display:grid;grid-template-columns:1fr 1fr;gap:13px}
  .fld{display:flex;flex-direction:column;gap:5px}
  .fld.full{grid-column:span 2}
  .fld label{font-size:11px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
  .fld input,.fld select,.fld textarea{padding:9px 11px;border-radius:9px;background:var(--card2);border:1px solid var(--line);color:var(--txt);outline:none;transition:.16s;width:100%}
  .fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--acc2);box-shadow:0 0 0 3px rgba(99,102,241,.14)}
  .fld textarea{resize:vertical;min-height:62px}
  .swatches{display:flex;gap:7px;flex-wrap:wrap}
  .sw-b{width:26px;height:26px;border-radius:8px;border:2px solid transparent;transition:.15s}
  .sw-b:hover{transform:scale(1.12)}
  .sw-b.on{border-color:#fff;box-shadow:0 0 0 2px var(--acc)}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{padding:6px 11px;border-radius:8px;border:1px solid var(--line);font-size:11.5px;font-weight:600;color:var(--mut);transition:.15s}
  .chip:hover{color:var(--txt);border-color:var(--acc2)}
  .chip.on{background:var(--acc);color:#fff;border-color:transparent}
  .mfoot{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:9px;justify-content:flex-end}
  .btn-g{padding:9px 18px;border-radius:9px;font-size:13px;font-weight:600;border:1px solid var(--line);color:var(--mut);transition:.16s}
  .btn-g:hover{color:var(--txt);border-color:var(--acc2)}
  .fbar{display:none;gap:9px;padding:11px 18px;border-bottom:1px solid var(--line);background:var(--card2);flex-wrap:wrap;align-items:center}
  .fbar.on{display:flex}
  .fbar select{padding:7px 10px;border-radius:8px;background:var(--card);border:1px solid var(--line);color:var(--txt);outline:none}
  .fbar label{font-size:11px;color:var(--mut);font-weight:600;margin-right:-4px}
  .tip{position:fixed;z-index:200;background:#000;border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:11.5px;pointer-events:none;
    opacity:0;transition:opacity .14s;max-width:230px;box-shadow:0 10px 26px -10px rgba(0,0,0,.9)}
  .tip.on{opacity:1}
  .tip .tt{font-weight:700;margin-bottom:2px}
  .tip .td{color:var(--mut);font-size:11px}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(70px);background:var(--card);border:1px solid var(--acc2);
    border-radius:11px;padding:11px 18px;font-size:13px;font-weight:600;z-index:300;opacity:0;transition:.3s cubic-bezier(.22,.8,.24,1);box-shadow:var(--shadow);display:flex;align-items:center;gap:9px}
  .toast.on{opacity:1;transform:translateX(-50%)}
  .toast svg{width:16px;height:16px;color:var(--ok)}

<script>
(function(){
'use strict';
const HOUR_PX=58,SNAP=15,API='/dashboard/api';
let DAY_START=8,DAY_END=20;
const ST={confirmado:{l:'Confirmado',c:'#34d399',i:'●'},pendiente:{l:'Pendiente',c:'#fbbf24',i:'◐'},curso:{l:'En curso',c:'#38bdf8',i:'▶'},
  finalizado:{l:'Finalizado',c:'#8b96ad',i:'✓'},cancelado:{l:'Cancelado',c:'#f87171',i:'✕'},noasistio:{l:'No asistió',c:'#c084fc',i:'⊘'}};
const DOW=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'],MON=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
let PROS=[{id:1,name:'Profesional',color:'#818cf8'}],SRV=[{n:'Servicio',c:'#818cf8'}];
let EV=[],BLOCKS=[];

const iso=d=>{const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};
const parse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const startW=d=>{const x=new Date(d);const g=x.getDay();x.setDate(x.getDate()-(g===0?6:g-1));return x};
const hhmm=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
const toMin=t=>{const[h,m]=t.split(':').map(Number);return h*60+m};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const T=new Date(),TD=iso(T);
let view='week',cur=new Date(T),mcMonth=new Date(T),sel=null,editId=null;
const hidden=new Set(),F={pro:'',srv:'',st:'',q:''};
const $=id=>document.getElementById(id);

const visible=()=>EV.filter(e=>!hidden.has(e.pro)
  &&(!F.pro||e.pro==+F.pro)&&(!F.srv||e.srv===F.srv)&&(!F.st||e.st===F.st)
  &&(!F.q||e.name.toLowerCase().includes(F.q)||(e.srv||'').toLowerCase().includes(F.q)));
const pro=id=>PROS.find(p=>p.id===id)||PROS[0];
function toast(m){const t=$('toast');$('toast-t').textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),2200)}

function win(){const s=startW(cur);return[iso(addD(s,-35)),iso(addD(s,63))]}
async function load(){
  try{
    const[a,b]=win();
    const r=await fetch(API+'/agenda?from='+a+'&to='+b,{headers:{'Accept':'application/json'}});
    if(!r.ok)throw 0;
    const d=await r.json();
    DAY_START=d.hours.start;DAY_END=d.hours.end;
    PROS=d.professionals.length?d.professionals:PROS;
    SRV=d.services.length?d.services:SRV;
    EV=d.appointments;BLOCKS=d.blocks;
  }catch(e){toast('⚠ No se pudieron cargar los turnos')}
  render();
}
async function post(path,body,method){
  const r=await fetch(API+path,{method:method||'POST',headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});
  if(!r.ok)throw new Error('http');
  return r.status===204?null:r.json();
}

function stats(){
  const d=visible().filter(e=>e.date===TD);
  const inc=d.filter(e=>['finalizado','curso','confirmado'].includes(e.st)).reduce((a,b)=>a+(b.price||0),0);
  const cnt={};d.forEach(e=>{if(e.st!=='cancelado')cnt[e.pro]=(cnt[e.pro]||0)+1});
  const top=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a])[0];
  const cards=[
    ['','Turnos hoy',d.length,d.filter(e=>e.st==='confirmado').length+' confirmados'],
    ['g','Confirmados',d.filter(e=>e.st==='confirmado').length,'listos para atender'],
    ['r','Cancelados',d.filter(e=>['cancelado','noasistio'].includes(e.st)).length,'hoy'],
    ['b','Ingresos del día','$'+inc.toLocaleString('es-AR'),'estimado'],
    ['p','Más ocupada',top?pro(+top).name:'—',top?cnt[top]+' turnos':'sin turnos'],
    ['a','Clientas nuevas',d.filter(e=>(e.visits||1)<=1).length,'primera visita']
  ];
  $('stats').innerHTML=cards.map(([c,l,v,d2])=>'<div class="st '+c+'"><div class="l">'+l+'</div><div class="v">'+v+'</div><div class="d">'+d2+'</div></div>').join('');
}
function miniCal(){
  const y=mcMonth.getFullYear(),m=mcMonth.getMonth();
  $('mc-title').textContent=MON[m]+' '+y;
  const first=new Date(y,m,1),off=(first.getDay()+6)%7,days=new Date(y,m+1,0).getDate();
  let h=['L','M','X','J','V','S','D'].map(d=>'<div class="mc-dow">'+d+'</div>').join('');
  for(let i=0;i<off;i++){const pd=new Date(y,m,-(off-i-1));h+='<div class="mc-d out">'+pd.getDate()+'</div>'}
  for(let d=1;d<=days;d++){const dt=new Date(y,m,d),s=iso(dt),has=EV.some(e=>e.date===s&&e.st!=='cancelado');
    h+='<button class="mc-d'+(s===TD?' today':'')+(s===iso(cur)?' sel':'')+'" data-d="'+s+'">'+d+(has?'<i class="dot"></i>':'')+'</button>'}
  $('mc').innerHTML=h;
  $('mc').querySelectorAll('[data-d]').forEach(b=>b.onclick=function(){cur=parse(b.dataset.d);if(view==='month')view='day',syncViews();load()});
}
function proList(){
  $('prolist').innerHTML=PROS.map(p=>{const n=visible().filter(e=>e.pro===p.id&&e.date===iso(cur)).length;
    return '<div class="pro'+(hidden.has(p.id)?' off':'')+'" data-p="'+p.id+'"><span class="sw" style="background:'+p.color+'"></span><span class="nm">'+esc(p.name)+'</span><span class="n">'+n+'</span></div>'}).join('');
  $('prolist').querySelectorAll('[data-p]').forEach(el=>el.onclick=function(){const id=+el.dataset.p;hidden.has(id)?hidden.delete(id):hidden.add(id);render()});
}
function upcoming(){
  const now=new Date(),nm=now.getHours()*60+now.getMinutes();
  const list=visible().filter(e=>(e.date>TD||(e.date===TD&&e.from>=nm))&&!['cancelado','finalizado','noasistio'].includes(e.st))
    .sort((a,b)=>a.date.localeCompare(b.date)||a.from-b.from).slice(0,5);
  $('upcnt').textContent=list.length;
  $('uplist').innerHTML=list.length?list.map(e=>'<div class="up" data-e="'+e.id+'"><div class="bar" style="background:'+e.color+'"></div><div class="t">'+hhmm(e.from)+'</div><div style="flex:1;min-width:0"><div class="n">'+esc(e.name)+'</div><div class="s">'+esc(e.srv)+' · '+pro(e.pro).name+'</div></div></div>').join('')
    :'<div class="empty">Sin turnos próximos.</div>';
  $('uplist').querySelectorAll('[data-e]').forEach(el=>el.onclick=function(){openDrawer(+el.dataset.e)});
}
function evHTML(e){
  const s=ST[e.st]||ST.pendiente,h=e.dur/60*HOUR_PX,short=h<52;
  return '<div class="ev'+(short?' short':'')+(e.st==='cancelado'?' cancel':'')+'" data-e="'+e.id+'" style="top:'+((e.from-DAY_START*60)/60*HOUR_PX)+'px;height:'+(h-3)+'px;background:'+e.color+'22;border-left-color:'+e.color+';color:'+e.color+'"><div class="r1"><span class="tm">'+hhmm(e.from)+'</span><span class="nm" style="color:var(--txt)">'+esc(e.name)+'</span><span class="stx" title="'+s.l+'">'+s.i+'</span></div><div class="sv">'+esc(e.srv)+'</div><div class="pr"><i style="background:'+pro(e.pro).color+'"></i>'+pro(e.pro).name+'</div><div class="rz"></div></div>';
}
function blkHTML(b){var h=b.dur/60*HOUR_PX;
  return '<div class="blk" data-b="'+b.id+'" title="Bloqueado: '+esc(b.reason)+'" style="top:'+((b.from-DAY_START*60)/60*HOUR_PX)+'px;height:'+(h-2)+'px"><div class="bt">'+hhmm(b.from)+' – '+hhmm(b.from+b.dur)+'</div><div class="bl"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>'+esc(b.reason)+'</div></div>'}
function blocked(date,from,dur){return BLOCKS.some(b=>b.date===date&&from<b.from+b.dur&&b.from<from+dur)}
function nowLine(){var n=new Date();if(n.getHours()<DAY_START||n.getHours()>=DAY_END)return'';
  var top=((n.getHours()*60+n.getMinutes())-DAY_START*60)/60*HOUR_PX;return '<div class="now" style="top:'+top+'px"></div>'}

function render(){
  stats();miniCal();proList();upcoming();
  $('curdate').innerHTML=headTitle();
  var g=$('grid'),mg=$('mgrid'),al=$('alist'),ch=$('colhead');
  g.style.display=mg.style.display=al.style.display='none';
  if(view==='month'){ch.style.display='grid';renderMonth();mg.style.display='grid'}
  else if(view==='agenda'){ch.style.display='none';renderAgenda();al.style.display='block'}
  else{ch.style.display='grid';renderTime();g.style.display='grid'}
}
function headTitle(){
  if(view==='week'||view==='timeline'){var s=startW(cur),e=addD(s,6);return s.getDate()+' – '+e.getDate()+' <span>'+MON[e.getMonth()]+' '+e.getFullYear()+'</span>'}
  if(view==='month')return MON[cur.getMonth()]+' <span>'+cur.getFullYear()+'</span>';
  return DOW[cur.getDay()]+' '+cur.getDate()+' <span>'+MON[cur.getMonth()]+'</span>';
}
function renderTime(){
  var days=view==='week'?Array.from({length:7},function(_,i){return addD(startW(cur),i)}):[cur];
  var cols=view==='timeline'?PROS.filter(p=>!hidden.has(p.id)):days;
  var n=cols.length||1;
  $('colhead').style.gridTemplateColumns='56px repeat('+n+',1fr)';
  $('grid').style.gridTemplateColumns='56px repeat('+n+',1fr)';
  $('colhead').innerHTML='<div class="ch"></div>'+(view==='timeline'
    ? cols.map(p=>'<div class="ch"><div class="pnm"><i style="background:'+p.color+'"></i>'+esc(p.name)+'</div><div class="dw" style="margin-top:2px">'+DOW[cur.getDay()]+' '+cur.getDate()+'</div></div>').join('')
    : cols.map(d=>{var s=iso(d);return '<div class="ch'+(s===TD?' td':'')+'"><div class="dw">'+DOW[d.getDay()]+'</div><div class="dn">'+d.getDate()+'</div></div>'}).join(''));
  var tc='<div class="tcol">';
  for(var h=DAY_START;h<DAY_END;h++)tc+='<div class="tlab">'+String(h).padStart(2,'0')+':00</div>';
  tc+='</div>';var html=tc;
  cols.forEach(function(c,i){
    var dstr=view==='timeline'?iso(cur):iso(c),past=dstr<TD;
    var slots='';for(var h=DAY_START;h<DAY_END;h++)slots+='<div class="slot" data-d="'+dstr+'" data-h="'+h+'"'+(view==='timeline'?' data-p="'+c.id+'"':'')+'></div>';
    var evs=visible().filter(e=>e.date===dstr&&(view!=='timeline'||e.pro===c.id));
    var blks=BLOCKS.filter(b=>b.date===dstr);
    html+='<div class="dcol'+(past?' past':'')+'" data-col="'+i+'" data-d="'+dstr+'"'+(view==='timeline'?' data-p="'+c.id+'"':'')+'>'+slots+blks.map(b=>blkHTML(b)).join('')+evs.map(e=>evHTML(e)).join('')+(dstr===TD?nowLine():'')+'</div>';
  });
  $('grid').innerHTML=html;bindGrid();
  if(!$('scroll')._sc){$('scroll').scrollTop=Math.max(0,(new Date().getHours()-DAY_START-1)*HOUR_PX);$('scroll')._sc=1}
}
function renderMonth(){
  $('colhead').style.gridTemplateColumns='repeat(7,1fr)';
  $('colhead').innerHTML=['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'].map(d=>'<div class="ch"><div class="dw">'+d+'</div></div>').join('');
  var y=cur.getFullYear(),m=cur.getMonth(),first=new Date(y,m,1),off=(first.getDay()+6)%7;var h='';
  for(var i=0;i<42;i++){var d=new Date(y,m,1-off+i),s=iso(d),out=d.getMonth()!==m;
    var evs=visible().filter(e=>e.date===s).sort((a,b)=>a.from-b.from),blks=BLOCKS.filter(b=>b.date===s);
    h+='<div class="mcell'+(out?' out':'')+(s===TD?' today':'')+'" data-d="'+s+'"><div class="dn">'+d.getDate()+'</div>'+
      blks.map(b=>'<div class="mblk">🔒 '+esc(b.reason)+'</div>').join('')+
      evs.slice(0,3).map(e=>'<div class="mev" data-e="'+e.id+'" style="background:'+e.color+'1e;border-left-color:'+e.color+';color:'+e.color+'">'+hhmm(e.from)+' '+esc(e.name)+'</div>').join('')+
      (evs.length>3?'<div class="mmore">+'+String(evs.length-3)+' más</div>':'')+'</div>'}
  $('mgrid').innerHTML=h;
  $('mgrid').querySelectorAll('.mcell').forEach(c=>c.onclick=ev=>{var t=ev.target.closest('[data-e]');if(t){openDrawer(+t.dataset.e);return}cur=parse(c.dataset.d);view='day';syncViews();render()});
}
function renderAgenda(){
  var list=visible().filter(e=>e.date>=TD).sort((a,b)=>a.date.localeCompare(b.date)||a.from-b.from);
  if(!list.length){$('alist').innerHTML='<div class="empty" style="padding:34px;text-align:center">No hay turnos próximos.</div>';return}
  var h='',last='';
  list.forEach(e=>{if(e.date!==last){last=e.date;var d=parse(e.date);h+='<div class="aday">'+DOW[d.getDay()]+' '+d.getDate()+' de '+MON[d.getMonth()]+(e.date===TD?' <span>· hoy</span>':'')+'</div>'}
    var s=ST[e.st]||ST.pendiente;
    h+='<div class="arow" data-e="'+e.id+'"><div class="tm">'+hhmm(e.from)+' – '+hhmm(e.from+e.dur)+'</div><div class="bar" style="background:'+e.color+'"></div><div style="flex:1;min-width:0"><div class="nm">'+esc(e.name)+'</div><div class="sv">'+esc(e.srv)+' · '+pro(e.pro).name+'</div></div><div class="rt"><span class="pill" style="background:'+s.c+'1f;color:'+s.c+'">'+s.i+' '+s.l+'</span></div></div>'});
  $('alist').innerHTML=h;
  $('alist').querySelectorAll('[data-e]').forEach(el=>el.onclick=function(){openDrawer(+el.dataset.e)});
}

var QCTX=null;
function bindGrid(){
  $('grid').querySelectorAll('.slot').forEach(s=>s.onclick=ev=>{
    QCTX={date:s.dataset.d,from:+s.dataset.h*60,pro:s.dataset.p?+s.dataset.p:null};
    var d=parse(QCTX.date),q=$('qmenu');
    $('qm-when').textContent=DOW[d.getDay()]+' '+d.getDate()+' '+MON[d.getMonth()].slice(0,3)+' · '+hhmm(QCTX.from);
    q.style.left=Math.min(ev.clientX,innerWidth-208)+'px';q.style.top=Math.min(ev.clientY,innerHeight-150)+'px';q.classList.add('on')});
  $('grid').querySelectorAll('.ev').forEach(el=>{el.addEventListener('pointerdown',start);
    el.addEventListener('mouseenter',ev=>showTip(ev,+el.dataset.e));el.addEventListener('mouseleave',hideTip)});
  $('grid').querySelectorAll('.blk').forEach(el=>el.onclick=e=>{e.stopPropagation();openBlockModal(+el.dataset.b)});
}
var D=null;
function start(ev){
  if(ev.button!==0)return;var el=ev.currentTarget,id=+el.dataset.e,e=EV.find(x=>x.id===id);
  var rz=ev.target.classList.contains('rz');var cols=[...$('grid').querySelectorAll('.dcol')];
  D={id:id,e:e,el:el,rz:rz,y0:ev.clientY,x0:ev.clientX,from0:e.from,dur0:e.dur,date0:e.date,pro0:e.pro,cols:cols,moved:false};
  el.setPointerCapture(ev.pointerId);document.addEventListener('pointermove',move);document.addEventListener('pointerup',end);hideTip();ev.preventDefault();
}
function move(ev){
  if(!D)return;var dy=ev.clientY-D.y0,dx=Math.abs(ev.clientX-D.x0);
  if(!D.moved&&Math.abs(dy)<3&&dx<3)return;D.moved=true;D.el.classList.add('drag');
  var dm=Math.round(dy/HOUR_PX*60/SNAP)*SNAP;
  if(D.rz){var dur=Math.max(SNAP,Math.min(D.dur0+dm,DAY_END*60-D.e.from));D.e.dur=dur;D.el.style.height=(dur/60*HOUR_PX-3)+'px'}
  else{var f=Math.max(DAY_START*60,Math.min(D.from0+dm,DAY_END*60-D.e.dur));D.e.from=f;D.el.style.top=((f-DAY_START*60)/60*HOUR_PX)+'px';D.el.querySelector('.tm').textContent=hhmm(f);
    var c=D.cols.find(c=>{var r=c.getBoundingClientRect();return ev.clientX>=r.left&&ev.clientX<=r.right});
    if(c){if(c.dataset.d!==D.e.date&&view!=='timeline'){D.e.date=c.dataset.d;c.appendChild(D.el)}if(c.dataset.p&&+c.dataset.p!==D.e.pro){D.e.pro=+c.dataset.p;c.appendChild(D.el)}}}
}
async function end(){
  document.removeEventListener('pointermove',move);document.removeEventListener('pointerup',end);
  if(!D)return;var d=D;D=null;d.el.classList.remove('drag');
  if(!d.moved){openDrawer(d.id);return}
  if(blocked(d.e.date,d.e.from,d.e.dur)){d.e.from=d.from0;d.e.dur=d.dur0;d.e.date=d.date0;d.e.pro=d.pro0;toast('🔒 Ese horario está bloqueado');render();return}
  var body={id:d.e.id,date:d.e.date,from:d.e.from,duration:d.e.dur,professional:pro(d.e.pro).name};
  toast('✓ '+d.e.name.split(' ')[0]+' · '+(d.rz?d.e.dur+' min':hhmm(d.e.from)));
  try{await post('/appointment/move',body)}catch(_){toast('⚠ No se pudo guardar');Object.assign(d.e,{from:d.from0,dur:d.dur0,date:d.date0,pro:d.pro0})}
  load();
}
function showTip(ev,id){var e=EV.find(x=>x.id===id);if(!e)return;var t=$('tip'),s=ST[e.st]||ST.pendiente;
  t.innerHTML='<div class="tt">'+esc(e.name)+'</div><div class="td">'+hhmm(e.from)+' – '+hhmm(e.from+e.dur)+' · '+e.dur+' min<br>'+esc(e.srv)+' · '+pro(e.pro).name+'<br>'+s.i+' '+s.l+(e.price?' · $'+e.price.toLocaleString('es-AR'):'')+'</div>';
  var r=ev.currentTarget.getBoundingClientRect();t.style.left=Math.min(r.right+9,innerWidth-245)+'px';t.style.top=r.top+'px';t.classList.add('on')}
var hideTip=function(){$('tip').classList.remove('on')};

function openDrawer(id){
  var e=EV.find(x=>x.id===id);if(!e)return;sel=id;
  var s=ST[e.st]||ST.pendiente,p=pro(e.pro),d=parse(e.date);
  $('d-av').textContent=e.name.split(' ').map(x=>x[0]).slice(0,2).join('');
  $('d-av').style.background='linear-gradient(135deg,'+e.color+','+p.color+')';
  $('d-name').textContent=e.name;$('d-phone').textContent=e.phone||'—';
  $('d-status').innerHTML='<span class="pill" style="background:'+s.c+'1f;color:'+s.c+'">'+s.i+' '+s.l+'</span>';
  $('dbody').innerHTML=
    '<div class="dsec"><h4>Este turno</h4>'+
      '<div class="kv"><span class="k">Fecha</span><span class="v">'+DOW[d.getDay()]+' '+d.getDate()+' '+MON[d.getMonth()]+'</span></div>'+
      '<div class="kv"><span class="k">Horario</span><span class="v">'+hhmm(e.from)+' – '+hhmm(e.from+e.dur)+' ('+e.dur+' min)</span></div>'+
      '<div class="kv"><span class="k">Servicio</span><span class="v">'+esc(e.srv)+'</span></div>'+
      '<div class="kv"><span class="k">Profesional</span><span class="v">'+p.name+'</span></div></div>'+
    '<div class="dsec"><h4>Historial</h4>'+
      '<div class="hstats"><div><div class="n">'+(e.visits||1)+'</div><div class="l">visitas</div></div>'+
        '<div><div class="n">'+(e.price?'$'+(e.price/1000).toFixed(0)+'k':'—')+'</div><div class="l">este turno</div></div>'+
        '<div><div class="n">'+((e.visits||1)>1?'sí':'nueva')+'</div><div class="l">recurrente</div></div></div></div>'+
    '<div class="dsec"><h4>Pagos</h4>'+
      '<div class="kv"><span class="k">Precio</span><span class="v">'+(e.price?'$'+e.price.toLocaleString('es-AR'):'—')+'</span></div>'+
      '<div class="kv"><span class="k">Seña</span><span class="v" style="color:'+(e.dep?'var(--ok)':'var(--mut)')+'">'+(e.dep?'$'+e.dep.toLocaleString('es-AR'):'sin seña')+'</span></div>'+
      '<div class="kv"><span class="k">Saldo</span><span class="v">'+(e.price?'$'+((e.price-(e.dep||0)).toLocaleString('es-AR')):'—')+'</span></div></div>'+
    '<div class="dsec"><h4>Notas internas</h4><div class="note">'+(esc(e.notes)||'Sin notas.')+'</div></div>';
  $('drawer').classList.add('on');$('scrim').classList.add('on');
}
var closeDrawer=function(){$('drawer').classList.remove('on');$('scrim').classList.remove('on');sel=null};

var mSt='pendiente',mCol=null;
function openModal(id,date,from,proId){
  editId=id;$('m-title').textContent=id?'Editar turno':'Nuevo turno';
  var e=id?EV.find(x=>x.id===id):null;
  $('m-name').value=e?e.name:'';$('m-phone').value=e?(e.phone||''):'';
  $('m-srv').innerHTML=SRV.map(s=>'<option '+(e&&e.srv===s.n?'selected':'')+'>'+esc(s.n)+'</option>').join('');
  $('m-pro').innerHTML=PROS.map(p=>'<option value="'+p.id+'" '+((e?e.pro:proId||PROS[0].id)===p.id?'selected':'')+'>'+esc(p.name)+'</option>').join('');
  $('m-date').value=e?e.date:(date||iso(cur));
  $('m-from').value=hhmm(e?e.from:(from||9*60));$('m-dur').value=e?e.dur:45;
  $('m-price').value=e&&e.price?'$'+e.price:'';$('m-dep').value=e&&e.dep?'$'+e.dep:'';$('m-notes').value=e?(e.notes||''):'';
  mSt=e?e.st:'pendiente';mCol=e?e.color:SRV[0].c;
  $('m-st').innerHTML=Object.entries(ST).map(function([k,v]){return '<button class="chip'+(mSt===k?' on':'')+'" data-k="'+k+'" style="'+(mSt===k?'background:'+v.c+';border-color:transparent;color:#0b0f1a':'')+'">'+v.i+' '+v.l+'</button>'}).join('');
  var PAL=['#818cf8','#6366f1','#a78bfa','#c084fc','#f472b6','#fb7185','#f87171','#fbbf24','#facc15','#34d399','#2dd4bf','#38bdf8','#60a5fa','#e879f9'];
  $('m-col').innerHTML=PAL.map(c=>'<button class="sw-b'+(mCol===c?' on':'')+'" data-c="'+c+'" style="background:'+c+'"></button>').join('');
  bindModal();syncTo();$('modal').classList.add('on');setTimeout(function(){$('m-name').focus()},120);
}
function bindModal(){
  $('m-st').querySelectorAll('[data-k]').forEach(b=>b.onclick=function(){mSt=b.dataset.k;$('m-st').querySelectorAll('[data-k]').forEach(x=>{var on=x.dataset.k===mSt,v=ST[x.dataset.k];x.classList.toggle('on',on);x.style.cssText=on?'background:'+v.c+';border-color:transparent;color:#0b0f1a':''})});
  $('m-col').querySelectorAll('[data-c]').forEach(b=>b.onclick=function(){mCol=b.dataset.c;$('m-col').querySelectorAll('.sw-b').forEach(x=>x.classList.toggle('on',x.dataset.c===mCol))});
}
var syncTo=function(){var f=toMin($('m-from').value||'09:00');$('m-to').value=hhmm(f+ +$('m-dur').value)};
var closeModal=function(){$('modal').classList.remove('on')};
async function save(){
  var name=$('m-name').value.trim();
  if(!name){$('m-name').focus();$('m-name').style.borderColor='var(--bad)';setTimeout(function(){$('m-name').style.borderColor=''},1400);return}
  var proId=+$('m-pro').value;
  var body={id:editId||undefined,name:name,phone:$('m-phone').value,srv:$('m-srv').value,professional:pro(proId).name,
    date:$('m-date').value,from:toMin($('m-from').value),duration:+$('m-dur').value,status:mSt,color:mCol,
    price:+($('m-price').value.replace(/\\D/g,''))||null,deposit:+($('m-dep').value.replace(/\\D/g,''))||null,notes:$('m-notes').value};
  if(blocked(body.date,body.from,body.duration)){toast('🔒 Ese horario está bloqueado');return}
  try{await post('/appointment',body);toast(editId?'✓ Turno actualizado':'✓ Turno creado')}catch(_){toast('⚠ No se pudo guardar');return}
  closeModal();closeDrawer();load();
}

var bEdit=null;
function openBlockModal(id){
  bEdit=id||null;var b=id?BLOCKS.find(x=>x.id===id):null;
  $('b-title').textContent=b?'Editar bloqueo':'Bloquear horario';
  $('b-reason').value=b?b.reason:'No disponible';
  $('b-dur').value=b?(b.dur>=(DAY_END-DAY_START)*60?'allday':String(b.dur)):'60';
  $('b-del').style.display=b?'block':'none';$('b-save').textContent=b?'Guardar':'Bloquear';
  $('bmodal').classList.add('on');setTimeout(function(){$('b-reason').select()},110);
}
async function saveBlock(){
  var durV=$('b-dur').value,reason=$('b-reason').value.trim()||'No disponible',allday=durV==='allday';
  var from=allday?DAY_START*60:(bEdit?BLOCKS.find(x=>x.id===bEdit).from:QCTX.from);
  var dur=allday?(DAY_END-DAY_START)*60:+durV;
  var body={id:bEdit||undefined,date:bEdit?BLOCKS.find(x=>x.id===bEdit).date:QCTX.date,from:from,duration:dur,reason:reason};
  try{await post('/block',body);toast(bEdit?'🔒 Bloqueo actualizado':'🔒 Horario bloqueado')}catch(_){toast('⚠ Error');return}
  $('bmodal').classList.remove('on');load();
}
async function delBlock(){if(!bEdit)return;try{await post('/block/'+bEdit,null,'DELETE')}catch(_){}$('bmodal').classList.remove('on');toast('Bloqueo quitado');load()}

function syncViews(){$('views').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.v===view))}
$('views').onclick=function(e){var b=e.target.closest('[data-v]');if(!b)return;view=b.dataset.v;syncViews();render()};
$('prev').onclick=function(){cur=view==='month'?new Date(cur.getFullYear(),cur.getMonth()-1,1):addD(cur,view==='day'||view==='timeline'?-1:-7);mcMonth=new Date(cur);load()};
$('next').onclick=function(){cur=view==='month'?new Date(cur.getFullYear(),cur.getMonth()+1,1):addD(cur,view==='day'||view==='timeline'?1:7);mcMonth=new Date(cur);load()};
$('todayb').onclick=function(){cur=new Date(T);mcMonth=new Date(T);load()};
$('mcp').onclick=function(){mcMonth=new Date(mcMonth.getFullYear(),mcMonth.getMonth()-1,1);miniCal()};
$('mcn').onclick=function(){mcMonth=new Date(mcMonth.getFullYear(),mcMonth.getMonth()+1,1);miniCal()};
$('newb').onclick=function(){openModal(null,iso(cur),9*60,null)};
$('q').oninput=function(e){F.q=e.target.value.toLowerCase().trim();render()};
$('fbtn').onclick=function(){$('fbar').classList.toggle('on');$('fbtn').classList.toggle('act')};
function fillFilters(){
  $('f-pro').innerHTML='<option value="">Todos</option>'+PROS.map(p=>'<option value="'+p.id+'">'+esc(p.name)+'</option>').join('');
  $('f-srv').innerHTML='<option value="">Todos</option>'+SRV.map(s=>'<option>'+esc(s.n)+'</option>').join('');
  $('f-st').innerHTML='<option value="">Todos</option>'+Object.entries(ST).map(function([k,v]){return '<option value="'+k+'">'+v.l+'</option>'}).join('');
}
['f-pro','f-srv','f-st'].forEach(id=>$(id).onchange=function(e){F[id.split('-')[1]]=e.target.value;render()});
$('f-clear').onclick=function(){F.pro=F.srv=F.st='';['f-pro','f-srv','f-st'].forEach(i=>$(i).value='');render()};
$('d-close').onclick=closeDrawer;$('scrim').onclick=function(){closeDrawer();closeModal()};
$('m-x').onclick=closeModal;$('m-cancel').onclick=closeModal;$('m-save').onclick=save;
$('m-from').onchange=syncTo;$('m-dur').onchange=syncTo;
$('modal').onclick=function(e){if(e.target===$('modal'))closeModal()};
$('qmenu').querySelectorAll('[data-a]').forEach(b=>b.onclick=function(){$('qmenu').classList.remove('on');if(b.dataset.a==='new')openModal(null,QCTX.date,QCTX.from,QCTX.pro);else openBlockModal()});
$('b-x').onclick=$('b-cancel').onclick=function(){$('bmodal').classList.remove('on')};
$('b-save').onclick=saveBlock;$('b-del').onclick=delBlock;
$('bmodal').onclick=function(e){if(e.target===$('bmodal'))$('bmodal').classList.remove('on')};
document.addEventListener('pointerdown',function(e){if(!e.target.closest('#qmenu')&&!e.target.closest('.slot'))$('qmenu').classList.remove('on')},true);
$('d-edit').onclick=function(){var id=sel;closeDrawer();openModal(id)};
$('d-wa').onclick=function(){var e=EV.find(x=>x.id===sel);if(e&&e.phone)window.open('https://wa.me/'+e.phone.replace(/\\D/g,''),'_blank');else toast('Sin WhatsApp')};
$('d-done').onclick=async function(){var e=EV.find(x=>x.id===sel);try{await post('/appointment',{id:e.id,status:'finalizado'});toast('✓ Completado')}catch(_){}closeDrawer();load()};
$('d-cancel').onclick=async function(){var e=EV.find(x=>x.id===sel);try{await post('/appointment',{id:e.id,status:'cancelado'});toast('Cancelado')}catch(_){}closeDrawer();load()};
$('d-repro').onclick=function(){toast('Arrastrá el turno en el calendario para reprogramarlo');closeDrawer()};
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){closeDrawer();closeModal();$('bmodal').classList.remove('on');$('qmenu').classList.remove('on')}
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;
  var k={d:'day',w:'week',m:'month',a:'agenda',t:'timeline'}[e.key.toLowerCase()];
  if(k){view=k;syncViews();render()}
  if(e.key==='n')openModal(null,iso(cur),9*60,null);
});
if(innerWidth<=720)view='agenda',syncViews();
fillFilters();load();
setInterval(function(){if(view!=='month'&&view!=='agenda')render()},60000);
})();
</script>
